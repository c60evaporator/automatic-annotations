services:
  grounding-dino:
    image: "${IMAGE_NAME:-grounding-dino-hf}:${IMAGE_TAG:-cu128-${IMAGE_RUNTIME:-devel}}"
    # docker build options
    build:
      context: .
      dockerfile: Dockerfile_${IMAGE_RUNTIME:-devel}
      # --build-arg option
      args:
        # GPU architecture (https://en.wikipedia.org/wiki/CUDA#GPUs_supported)
        TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-8.9}"
        # Match host UID/GID to avoid permission issues on bind mounts
        USERNAME: "${USERNAME:-developer}"
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"

        # Proxy settings (if needed)
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        http_proxy: "${HTTP_PROXY:-}"

    # Container name (--name option)
    container_name: grounding_dino_hf_${IMAGE_RUNTIME:-devel}
    # Set resource sharing to host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]  # --gpus
    ipc: host  # --ipc
    shm_size: "${SHM_SIZE:-16g}"  # --shm-size
    # Stable operation for development
    init: true  # --init option
    stdin_open: true  # -i option
    tty: true  # -t option
    # Set startup directory
    working_dir: /workspace
    # Proxy settings for downloading models from Hugging Face Hub at runtime (if needed)
    environment:
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
    
    # Volume mounts
    volumes:
      # Weights (Hugging Face cache)
      - ~/.cache/huggingface:/home/${USERNAME:-developer}/.cache/huggingface
      # Source code
      - ./src:/workspace/src/grounding_dino
      - ../../common:/workspace/src/common
      - ./notebook:/workspace/notebook
      # Nuscenes dataset
      - /data/nuscenes:/workspace/data/nuscenes
