services:
  sam2:
    image: "${IMAGE_NAME:-sam2}:${IMAGE_TAG:-cu124}"
    # docker build options
    build:
      context: .
      dockerfile: Dockerfile_raw
      # --build-arg option
      args:
        # GPU architecture (https://en.wikipedia.org/wiki/CUDA#GPUs_supported)
        TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-8.9}"
        # Match host UID/GID to avoid permission issues on bind mounts
        USERNAME: "${USERNAME:-developer}"
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"

        # Proxy settings (if needed)
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        http_proxy: "${HTTP_PROXY:-}"

    # Container name (--name option)
    container_name: sam2_dev
    # Set resource sharing to host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]  # --gpus
    ipc: host  # --ipc
    shm_size: "${SHM_SIZE:-16g}"  # --shm-size
    # Stable operation for development
    init: true  # --init option
    stdin_open: true  # -i option
    tty: true  # -t option
    # Set startup directory
    working_dir: /workspace
    
    # Volume mounts
    volumes:
      # Weights for SAM2
      - ./checkpoints:/workspace/sam2/checkpoints
      # Source code
      - ./src:/workspace/src
      - ../../adapters:/workspace/src/adapters
      - ./notebook:/workspace/notebook
      # Nuscenes dataset for video prediction
      - /data/nuscenes:/workspace/data/nuscenes
