services:
  autoann_pipeline3:
    image: "${IMAGE_NAME:-autoann-pipeline3}:${IMAGE_TAG:-cu124-${IMAGE_RUNTIME:-devel}}"
    # docker build options
    build:
      context: .
      dockerfile: Dockerfile_${IMAGE_RUNTIME:-devel}
      # --build-arg option
      args:
        # GPU architecture (https://en.wikipedia.org/wiki/CUDA#GPUs_supported)
        TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-8.9}"
        # Match host UID/GID to avoid permission issues on bind mounts
        USERNAME: "${USERNAME:-developer}"
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"

        # Proxy settings (if needed)
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        http_proxy: "${HTTP_PROXY:-}"

    # Container name (--name option)
    container_name: autoann_pipeline3_${IMAGE_RUNTIME:-devel}
    # Set resource sharing to host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]  # --gpus
    ipc: host  # --ipc
    shm_size: "${SHM_SIZE:-16g}"  # --shm-size
    # Stable operation for development
    init: true  # --init option
    stdin_open: true  # -i option
    tty: true  # -t option
    # Set startup directory
    working_dir: /workspace
    
    # Volume mounts
    volumes:
      # Weights for GroundingDINO
      - ../../models/grounding_dino/weights:/workspace/GroundingDINO/weights
      # Weights for SAM2
      - ../../models/sam2/checkpoints:/workspace/sam2/checkpoints
      # Weights for Depth-Anything-3 (Hugging Face cache)
      - ~/.cache/huggingface:/home/${USERNAME:-developer}/.cache/huggingface
      # Pipeline source code
      - ./src:/workspace/src/pipeline
      # Common source code
      - ../../common:/workspace/src/common
      # GroundingDINO source code
      - ../../models/grounding_dino/src:/workspace/src/grounding_dino
      # SAM2 source code
      - ../../models/sam2/src:/workspace/src/sam2
      # Depth-Anything-3 source code
      - ../../models/depth_anything3/src:/workspace/src/depth_anything3
      # Notebooks
      - ./notebook:/workspace/notebook
      # Nuscenes dataset for video prediction
      - /data/nuscenes_datasets/nuscenes:/workspace/data/nuscenes
