[alembic]
script_location = alembic

# リビジョンファイル名に日時を含めて時系列を追いやすくする
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# `app` パッケージを import できるようにする（alembic を webapp/app/ の親から実行する前提）
prepend_sys_path = .

timezone = UTC

# sqlalchemy.url はここに書かない。
# env.py が app.core.config.Settings から取得する（.env と設定を一元化するため）
sqlalchemy.url =


[post_write_hooks]
# 必要ならここで ruff / black を自動適用する
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
