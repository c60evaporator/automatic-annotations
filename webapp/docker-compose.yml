services:
  # Frontend and DB (Streamlit and SQLite)
  webapp:
    image: annotation_web
    build:
      context: ./webapp
      args:
        # Proxy settings (if needed for development)
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        # Match host UID/GID to avoid permission issues on bind mounts
        # NOTE: $UID は bash の内部変数で export されないため、compose からは
        #       見えず常に既定値になる。.env に HOST_UID/HOST_GID を書くこと
        - UID=${HOST_UID:-1000}
        - GID=${HOST_GID:-1000}
    ports:
      # Expose Streamlit on port 80 externally
      - 80:8501
    # .env を環境変数として注入（pydantic-settingsのenv_fileはプロセスのCWD基準で解決されるため、環境変数で渡すほうが確実）
    env_file:
      - .env
    environment:
      # コンテナ内の固定パス
      DATA_ROOT: /data
      DERIVED_ROOT: /derived
      SQLITE_PATH: /db/app.db
      INFERENCE_BASE_URL: http://inference:8000
      # No proxy for connections to local services (inference and webapp containers)
      NO_PROXY: "localhost,127.0.0.1,inference,webapp"
      no_proxy: "localhost,127.0.0.1,inference,webapp"
      # /workspace はアプリ本体、/opt/shared は common パッケージの親
      PYTHONPATH: /workspace:/opt/shared
    volumes:
      # webappフォルダをマウント
      - ./webapp:/workspace
      # 共有モジュール（common.mask_rle / common.box_ops）。
      # /workspace の内側に置くと、ホストの ./webapp に空ディレクトリが
      # 作られてしまうため、独立したパスへマウントする
      - ./common:/opt/shared/common:ro
      # データセットをマウント
      - ${HOST_DATA_ROOT}:/data:ro  # 読み取り専用
      # 深度マップ等の生成派生物保存先
      - derived:/derived
      # SQLite 用のボリューム（バインドマウントだとホストOSによってWALのロックが正しく効かないため、名前付きボリュームを使う）
      - dbdata:/db
    depends_on:
      inference:
        # Waiting for the inference server
        condition: service_healthy

  # Inference server (backend for model inference)
  inference:
    # NOTE: 既定値の中での入れ子展開（${A:-x-${B:-y}}）は compose の版によって
    #       解釈が異なる。変更する場合は `docker compose config` で確認すること
    image: "${IMAGE_NAME:-autoann-app-inference}:${IMAGE_TAG:-cu124-devel}"
    build:
      context: ./inference
      dockerfile: Dockerfile_${IMAGE_RUNTIME:-devel}
      args:
        # GPU architecture (https://en.wikipedia.org/wiki/CUDA#GPUs_supported)
        TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-8.9}"
        # Match host UID/GID to avoid permission issues on bind mounts
        USERNAME: "${USERNAME:-developer}"
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
        # Proxy settings (if needed)
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        http_proxy: "${HTTP_PROXY:-}"
        https_proxy: "${HTTPS_PROXY:-}"
    ports:
      - 8000:8000
    environment:
      DATA_ROOT: /data
      DERIVED_ROOT: /derived
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-0}"
      PYTHONPATH: /workspace:/opt/shared
      # 実行時プロキシ（Hugging Face の重みや GroundingDINO の config ダウンロード用）。
      # イメージに焼き込むとURLが永続化されキャッシュも飛ぶため、ここで渡す。
      # 小文字版は curl/wget など小文字しか見ないツール向け（ビルド時は
      # BuildKit が両方セットするが、実行時は自動注入されない）。
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
      # No proxy for connections to local services (inference and webapp containers)
      NO_PROXY: "localhost,127.0.0.1,inference,webapp"
      no_proxy: "localhost,127.0.0.1,inference,webapp"
    volumes:
      - ./inference:/workspace
      # 共有モジュール（webapp と同じ実体をマウントする）
      - ./common:/opt/shared/common:ro
      - ${HOST_DATA_ROOT}:/data:ro
      - derived:/derived
      # Weights for Depth-Anything-3 (Hugging Face cache)
      - ~/.cache/huggingface:/home/${USERNAME:-developer}/.cache/huggingface
      # Weights for GroundingDINO and SAM2
      - ./checkpoints:/opt/checkpoints
    shm_size: "${SHM_SIZE:-8g}"  # --shm-size
    healthcheck:
      # webapp を待たせるため、/health は「起動済み」を返す軽い実装にする
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      # Wait longer initially to allow model downloads
      start_period: 300s
    # GPU を使う場合
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  derived:
  dbdata:
